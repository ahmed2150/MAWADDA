<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إمبدو | الدورة الثانية قريباً</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        /* خلفية داكنة للموقع */
        body {
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #e6edf3;
            padding: 20px;
        }

        /* صندوق المحتوى بتصميم داكن */
        .container {
            background: #161b22;
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #30363d;
            max-width: 600px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* الشريط الملون في الأعلى */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #d91468, #4ac2c7, #3b7dbd);
        }

        /* ⭕ تنسيق اللوجو داخل دائرة سوداء */
        .logo-wrapper {
            width: 160px;
            height: 160px;
            margin: 0 auto 30px auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #d91468, #4ac2c7, #3b7dbd);
            box-shadow: 0 0 25px rgba(74, 194, 199, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: contain;
            background: #000000; /* ⬅️ تم تغيير الخلفية إلى الأسود */
            padding: 15px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* العداد التنازلي */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .time-box {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 10px;
            min-width: 80px;
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
            border-color: #4ac2c7;
        }

        .time-box span {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: #4ac2c7;
        }

        .time-box small {
            font-size: 0.9rem;
            color: #8b949e;
        }

        /* التجاوب مع الجوال */
        @media (max-width: 480px) {
            .container { padding: 40px 20px; }
            h1 { font-size: 1.6rem; }
            p { font-size: 1rem; }
            .countdown { gap: 8px; }
            .time-box { min-width: 60px; padding: 10px; }
            .time-box span { font-size: 1.4rem; }
            .time-box small { font-size: 0.8rem; }
            .logo-wrapper { width: 130px; height: 130px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ⭕ اللوجو داخل دائرة سوداء -->
        <div class="logo-wrapper">
            <img src="https://imgs.search.brave.com/95OrmFaajcVO23iJneaG5_BA4xfSpfirzYzS8-qSFMA/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tYXdh/ZGRhLWVnLmNvbS9h/c3NldHMvaW1nL0xv/Z28lMjBvbiUyMGRh/cmslMjBjb2xvciUy/MGJhY2tncm91bmQu/cG5n" alt="شعار منصة إمبدو">
        </div>
        
        <h1>اكتمل العدد في الدورة الأولى!</h1>
        <p>نشكركم على الإقبال الكبير. نظراً لنجاح الدورة الأولى، يسعدنا أن نعلن أن التسجيل في الدورة الثانية سيبدأ قريباً. ترقبوا الموعد!</p>

        <div class="countdown" id="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <small>يوم</small>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <small>ساعة</small>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <small>دقيقة</small>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <small>ثانية</small>
            </div>
        </div>
    </div>

    <script>
        // ⏰ تاريخ بدء التسجيل في الدورة الثانية: 20 أكتوبر 2026
        const targetDate = new Date("Oct 21, 2026 17:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "<h2 style='color:#4ac2c7;'>🎉 التسجيل في الدورة الثانية متاح الآن!</h2>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
